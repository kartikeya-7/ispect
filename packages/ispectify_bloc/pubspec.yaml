name: ispectify_bloc
description: BLoC state management integration for ISpect toolkit
version: 4.4.0+102
homepage: https://github.com/yelmuratoff/ispect.git
issue_tracker: https://github.com/yelmuratoff/ispect/issues
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

dependency_overrides:
  ispectify:
    path: ../ispectify

dependencies:
  ispectify:
    git:
      url: https://github.com/kartikeya-7/ispect.git
      ref: v.101
      path: packages/ispectify

  bloc: 9.0.0
  meta: 1.16.0

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.14
