name: ispect
description: Logging and inspector tool for Flutter development and testing
version: 4.4.0+107
homepage: https://github.com/yelmuratoff/ispect.git
issue_tracker: https://github.com/yelmuratoff/ispect/issues
publish_to: none

topics:
  - inspector
  - ispect
  - debug
  - toolkit
  - debug-toolkit

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

environment:
  sdk: ">=3.6.0 <4.0.0"

dependency_overrides:
  ispectify:
    path: ../ispectify

dependencies:
  flutter:
    sdk: flutter
  # Use an explicit version constraint instead of 'any' for pub scoring & reproducibility.
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  # meta pinned (avoid 'any') to satisfy pub validation and enable deterministic resolution.
  meta: ^1.17.0
  collection: ^1.19.0

  # Logging
  ispectify:
    git:
      url: https://github.com/kartikeya-7/ispect.git
      ref: v4.4.0+107
      path: packages/ispectify

  # Utils
  path_provider: ^2.1.5
  path: ^1.9.0
  device_info_plus: 12.3.0
  package_info_plus: ^8.3.0
  share_plus: ^11.0.0
  web: ^1.1.1
  open_filex: ^4.7.0

  # UI
  draggable_panel: 1.2.0
  provider: ^6.1.5
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
