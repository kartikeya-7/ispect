name: ispectify_dio
description: Dio HTTP client integration for ISpect toolkit
version: 4.4.0+107
homepage: https://github.com/yelmuratoff/ispect.git
issue_tracker: https://github.com/yelmuratoff/ispect/issues
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

dependency_overrides:
  ispectify:
    path: ../ispectify

dependencies:
  ansicolor: ^2.0.3
  dio: 5.8.0+1
  ispectify:
    git:
      url: https://github.com/kartikeya-7/ispect.git
      ref: v4.4.0+107
      path: packages/ispectify

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.14
